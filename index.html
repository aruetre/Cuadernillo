<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuadernillo</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <button id="btn-open-notebook" class="text-btn" title="Abrir cuaderno">
          <span class="btn-label">Abrir cuaderno</span>
        </button>
        <button id="btn-new-page" class="icon-btn" title="Nueva página" aria-label="Nueva página" disabled></button>
      </div>
      <nav id="tree" aria-label="Páginas del cuaderno">
        <p class="tree-empty">Ningún cuaderno abierto.<br />Elige una carpeta con ficheros .md o crea una vacía.</p>
      </nav>
      <div id="outline-section">
        <button id="outline-header" type="button" aria-expanded="true">Índice del documento</button>
        <nav id="outline" aria-label="Títulos del documento"></nav>
      </div>
    </aside>
    <main id="content">
      <header id="page-header">
        <button id="btn-toggle-sidebar" class="icon-btn" title="Ocultar/mostrar árbol" aria-label="Ocultar o mostrar el árbol"></button>
        <span id="page-path">Cuadernillo</span>
        <span id="save-status" data-state="idle"></span>
        <span class="spacer"></span>
        <button id="btn-toggle-toolbar" class="icon-btn" title="Ocultar/mostrar barra de herramientas" aria-label="Ocultar o mostrar la barra de herramientas"></button>
        <button id="btn-view" class="icon-btn" title="Ver código markdown" aria-label="Alternar vista de código y formato" disabled></button>
        <button id="btn-copy-doc" class="icon-btn" title="Copiar todo el documento" aria-label="Copiar documento" disabled></button>
        <button id="btn-templates" class="icon-btn" title="Plantillas" aria-label="Insertar plantilla" disabled></button>
        <button id="btn-settings" class="icon-btn" title="Ajustes del cuaderno" aria-label="Ajustes del cuaderno" disabled></button>
        <button id="btn-help" class="icon-btn" title="Ayuda de markdown" aria-label="Ayuda de markdown"></button>
        <span class="header-sep"></span>
        <button id="btn-rename" class="icon-btn" title="Renombrar página" aria-label="Renombrar página" disabled></button>
        <button id="btn-delete" class="icon-btn danger" title="Eliminar página" aria-label="Eliminar página" disabled></button>
      </header>
      <div id="toolbar" role="toolbar" aria-label="Herramientas de formato"></div>
      <div id="editor-wrap">
        <div id="editor"></div>
        <textarea id="source-view" spellcheck="false" aria-label="Código markdown"></textarea>
        <div id="welcome">
          <h1>Cuadernillo</h1>
          <p>Editor markdown WYSIWYG con estructura de cuaderno tipo Zim.</p>
          <p>Abre un cuaderno para empezar. Cada página es un fichero .md; cada subcarpeta, una rama del árbol.</p>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
